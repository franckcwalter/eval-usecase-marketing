name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            requirements-test.txt
      - name: Installer les dépendances
        run: pip install -r requirements-test.txt
      - name: Tests de l'API et du classement
        run: pytest -v

  evaluate-model:
    needs: test
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///reports/mlflow.db
      MLFLOW_DISABLE_AGENT_HINT: "1"
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            requirements-test.txt
      - name: Installer les dépendances d’évaluation
        run: pip install -r requirements-test.txt
      - name: Récupérer le modèle précédent et vérifier le gel de la référence
        shell: bash
        run: |
          mkdir -p reports/champion
          if ! git cat-file -e "${BASE_SHA}:models/pipeline.joblib" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          git show "${BASE_SHA}:models/pipeline.joblib" > reports/champion/pipeline.joblib
          git show "${BASE_SHA}:models/pipeline.json" > reports/champion/pipeline.json
          if git cat-file -e "${BASE_SHA}:evaluation/golden.json" 2>/dev/null; then
            git diff --exit-code "${BASE_SHA}" -- evaluation/reference.csv evaluation/golden.json
          fi
      - name: Comparer le candidat au modèle précédent et au golden run
        run: python -m scripts.evaluate_model --candidate-dir models --champion-dir reports/champion --release-tag "${GITHUB_SHA}"
      - name: Conserver la décision et le suivi MLflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-modele
          path: |
            reports/
            mlruns/

  build-and-push:
    needs: [test, evaluate-model]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
