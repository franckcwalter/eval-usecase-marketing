groups:
  - name: bank-marketing
    rules:
      - alert: ApiIndisponible
        expr: up{job="api"} == 0
        for: 1m
        annotations:
          summary: "L’API ne répond plus à la collecte des métriques"
      - alert: ErreursServeur
        expr: sum(increase(bank_http_requests_total{status=~"5.."}[5m])) > 0
        annotations:
          summary: "L’API a renvoyé des erreurs 5xx"
      - alert: PredictionLente
        expr: histogram_quantile(0.95, sum by (le) (rate(bank_http_duration_seconds_bucket{route="/predict"}[5m]))) > 0.5
        for: 5m
        annotations:
          summary: "Le p95 de /predict dépasse le repère de 500 ms"
